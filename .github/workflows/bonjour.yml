name: Bonjour CI

on:
  push:
    branches: [ main ]

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info système
        run: |
          echo "=== Ubuntu ==="
          lsb_release -a
          echo "=== Python ==="
          python3 --version
          echo "=== Cœurs ==="
          nproc

      - name: Mémoire et disque
        run: |
          echo "=== Mémoire ==="
          free -h
          echo "=== Disque ==="
          df -h /   
