name: CI

on:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier la syntaxe
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./.git/*")   
      - name: Résumé
        run: |
          NB_PY=$(find . -name "*.py" -not -path "./.git/*" | wc -l)
          NB_LIGNES=$(find . -name "*.py" -not -path "./.git/*" -exec cat {} + | wc -l)
          {
            echo "## Résumé"
            echo ""
            echo "| Fichiers Python | Lignes de code |"
            echo "|---|---|"
            echo "| $NB_PY | $NB_LIGNES |"
          } >> "$GITHUB_STEP_SUMMARY"   
